name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Resolve FFmpeg path
        shell: pwsh
        run: |
          $ffmpeg = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          if (-not $ffmpeg) { throw "Could not resolve ffmpeg path" }
          "FFMPEG_PATH=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name "SOP Video Cutter" --collect-all tkinterdnd2 --add-binary "$env:FFMPEG_PATH;." video_processor.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SOP-Video-Cutter-Windows
          path: dist/SOP Video Cutter/
